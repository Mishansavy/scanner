version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # typescript-eslint caps its TypeScript peer below 6.1.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the Node major used in CI and local dev.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
